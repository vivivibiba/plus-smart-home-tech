services:
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092" # for client connections
      - "9101:9101" # JMX
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  postgres:
    image: postgres:16-alpine
    container_name: analyzer-db
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: analyzer
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
    volumes:
      - analyzer-db-data:/var/lib/postgresql/data


  shopping-store-db:
    image: postgres:16-alpine
    container_name: shopping-store-db
    ports:
      - "5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopping_store
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    volumes:
      - shopping-store-db-data:/var/lib/postgresql/data

  shopping-cart-db:
    image: postgres:16-alpine
    container_name: shopping-cart-db
    ports:
      - "5434:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopping_cart
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    volumes:
      - shopping-cart-db-data:/var/lib/postgresql/data

  warehouse-db:
    image: postgres:16-alpine
    container_name: warehouse-db
    ports:
      - "5435:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic telemetry.sensors.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic telemetry.snapshots.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic telemetry.hubs.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true
volumes:
  analyzer-db-data:
  shopping-store-db-data:
  shopping-cart-db-data:
  warehouse-db-data:
