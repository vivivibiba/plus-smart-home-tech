server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: shopping-store
          uri: lb://shopping-store
          predicates:
            - Path=/shopping-store,/shopping-store/**
          filters:
            - PrefixPath=/api/v1
        - id: shopping-cart
          uri: lb://shopping-cart
          predicates:
            - Path=/shopping-cart,/shopping-cart/**
          filters:
            - PrefixPath=/api/v1
        - id: warehouse
          uri: lb://warehouse
          predicates:
            - Path=/warehouse,/warehouse/**
          filters:
            - PrefixPath=/api/v1
        - id: order
          uri: lb://order
          predicates:
            - Path=/order,/order/**
          filters:
            - PrefixPath=/api/v1
        - id: payment
          uri: lb://payment
          predicates:
            - Path=/payment,/payment/**
          filters:
            - PrefixPath=/api/v1
        - id: delivery
          uri: lb://delivery
          predicates:
            - Path=/delivery,/delivery/**
          filters:
            - PrefixPath=/api/v1
